services:
  nginx:
    image: nginx:1.18
    depends_on:
      - php-fpm
    environment:
      - NGINX_PORT=80
      - FASTCGI_HOST=php-fpm
      - FASTCGI_PORT=9000
      - DOCUMENT_ROOT=/usr/local/src/laravel-auth/public
      - UPLOAD_MAX_FILESIZE=50M
      - CORS_SERVER_NAME=${CORS_SERVER_NAME}
    ports:
      - ${COMPOSE_NGINX_PORT}:80
    volumes:
      - ./stack/nginx/templates/default.conf.template:/etc/nginx/conf.d/default.conf.template
      - ./stack/nginx/entrypoint.sh:/entrypoint.sh
      - .:/usr/local/src/laravel-auth
    command: "/bin/bash /entrypoint.sh"

  database:
    image: postgres:13
    volumes:
      - data:/data/postgres
    ports:
      - ${COMPOSE_DB_PORT}:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/data/postgres/laravel-auth

  php-fpm:
    image: itdevgroup/php-fpm8.2
    depends_on:
      - database
    links:
      - database
    volumes:
      - .:/usr/local/src/laravel-auth
    working_dir: /usr/local/src/laravel-auth
    environment:
      - COMPOSER_MEMORY_LIMIT=4G


  node:
    image: node:20
    restart: "no"
    working_dir: /usr/local/src/laravel-auth
    ports:
      - "5173:5173"
    volumes:
      - .:/usr/local/src/laravel-auth
    command: "npm run dev -- --host 0.0.0.0 --port 5173"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1288:1025"
      - "8780:8025"
    restart: "no"

volumes:
  data: {}
